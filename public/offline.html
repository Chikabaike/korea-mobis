<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения — KOREA-MOBIS</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0a0a0a;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        button { background: #fafafa; color: #0a0a0a; }
      }
      .wrap { max-width: 420px; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { opacity: 0.7; margin: 0 0 24px; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #0a0a0a; color: #fff;
        padding: 12px 22px; border-radius: 999px; font-weight: 600;
        transition: transform .15s ease;
      }
      button:active { transform: scale(.97); }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 8px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p><span class="dot"></span>Нет подключения</p>
      <h1>Вы офлайн</h1>
      <p>Похоже, интернет недоступен. Проверьте соединение и попробуйте снова.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
